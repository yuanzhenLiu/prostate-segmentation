[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classic-unet-video-frame-segmentation"
version = "0.1.0"
description = "Classic U-Net pipeline for binary segmentation of video-derived image frames"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
